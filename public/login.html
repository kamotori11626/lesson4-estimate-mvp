<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | 見積・受注前処理エージェント</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow dark">東和精密部品株式会社</p>
        <h1 id="login-title">デモ環境へログイン</h1>
        <p class="notice">模擬データだけを使用するメンター確認用環境です。実在する顧客情報・価格・図面は入力しないでください。</p>
        <form id="login-form" class="login-form">
          <label>ユーザー名<input id="username" name="username" autocomplete="username" required maxlength="100"></label>
          <label>パスワード<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="300"></label>
          <button type="submit">ログイン</button>
        </form>
        <p id="login-message" role="alert" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
