services:
  - type: web
    name: lesson4-estimate-demo
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lesson4-estimate-demo-db
          property: connectionString
      - key: DATABASE_SSL_MODE
        value: disable
      - key: DEMO_DATA_ONLY
        value: true
      - key: DEMO_DATA_AS_OF
        value: 2026-09-06
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_DISPLAY_NAME
        sync: false
      - key: DEMO_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_MINUTES
        value: 480
      - key: LOGIN_MAX_FAILURES
        value: 5
      - key: LOGIN_FAILURE_WINDOW_MINUTES
        value: 15
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: lesson4-estimate-demo-db
    plan: free
    databaseName: lesson4_mvp
    user: lesson4_mvp_user
